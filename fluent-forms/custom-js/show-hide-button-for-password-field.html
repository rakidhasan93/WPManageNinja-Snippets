<style>
/* Password wrapper */
.ff-password-wrapper {
    position: relative;
}

/* Ensure padding for toggle button */
.ff-password-wrapper input[type="password"],
.ff-password-wrapper input[type="text"] {
    padding-right: 40px !important;
}

/* Toggle button style */
.ff-password-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 16px;
    user-select: none;
}
</style>

<script>
    
(function($){
    $form.ready(function () {
        const $passwordInput = $form.find('#ff_3_password');

        if ($passwordInput.length === 0) return;

        // Wrap the input
        const $wrapper = $('<div class="ff-password-wrapper" style="position:relative;"></div>');
        $passwordInput.wrap($wrapper);

        // Icons
        const eyeOpen = `
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 10s4-6 9-6 9 6 9 6-4 6-9 6-9-6-9-6z"></path>
                <circle cx="10" cy="10" r="3"></circle>
            </svg>
        `;

        const eyeClosed = `
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 10 20C5 20 1 10 1 10s4-6 9-6c1.61 0 3.09.5 4.36 1.36"></path>
                <path d="M1 1l18 18"></path>
            </svg>
        `;

        // Default: password hidden → show CLOSED eye
        const $toggleBtn = $('<span class="ff-password-toggle" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer;"></span>');
        $toggleBtn.html(eyeClosed);

        $passwordInput.parent().append($toggleBtn);

        // Toggle logic
        $toggleBtn.on('click', function () {
            const isHidden = $passwordInput.attr('type') === 'password';

            if (isHidden) {
                $passwordInput.attr('type', 'text');   // show password
                $toggleBtn.html(eyeClosed);              // open eye
            } else {
                $passwordInput.attr('type', 'password'); // hide password
                $toggleBtn.html(eyeOpen);              // closed eye
            }
        });
    });
})(jQuery);

</script>
